<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; connect-src 'none'">
  <title>转播包装模板制作</title>
  <link rel="stylesheet" href="template-panel.css">
  <script src="template-panel.js" defer></script>
</head>
<body>
  <header>
    <div><h1>转播包装模板制作</h1><p id="document">正在连接 Adobe</p></div>
    <button id="refresh" class="quiet" type="button" aria-label="刷新当前作品" title="刷新当前作品">刷新</button>
  </header>
  <main>
    <fieldset id="controls" disabled>
      <label class="field">模板模块
        <select id="module"><option value="football">足球比分条</option><option value="stage">舞台报幕条</option></select>
      </label>
      <button id="insertKit" class="kit" type="button">插入整套比分条</button>
      <section id="cards">
        <h2>队伍色卡</h2>
        <div class="grid">
          <div class="swatch"><input id="home" aria-label="主队预览颜色" type="color" value="#C8102E"><button type="button" data-control="home">主队色卡</button></div>
          <div class="swatch"><input id="away" aria-label="客队预览颜色" type="color" value="#00529F"><button type="button" data-control="away">客队色卡</button></div>
        </div>
      </section>
      <section>
        <h2>Logo 位置</h2>
        <div id="logos" class="grid"></div>
      </section>
      <section>
        <h2>文字图层</h2>
        <div id="text" class="grid"></div>
      </section>
      <section id="ae" hidden>
        <h2>动画</h2>
        <button id="rig" type="button">创建入退场控制层</button>
      </section>
      <details>
        <summary>导出设置</summary>
        <label class="field">模板名称<input id="name" type="text" maxlength="64"></label>
        <label class="field">模板标识<input id="identity" type="text" maxlength="48" spellcheck="false"></label>
        <div class="choice">
          <button id="base" type="button">沿用已有动效和预设</button><span id="baseSelection"></span>
          <button id="clearBase" class="quiet" type="button" hidden>移除</button>
        </div>
        <div id="footballPack" class="choice">
          <button id="pack" type="button">合并足球全局包装</button><span id="packSelection"></span>
          <button id="clearPack" class="quiet" type="button" hidden>移除</button>
        </div>
      </details>
      <button class="primary" id="export" type="button">导出模板</button>
    </fieldset>
    <p id="status" role="status" aria-live="polite">打开文档或合成后即可插入控件。</p>
  </main>
</body>
</html>
