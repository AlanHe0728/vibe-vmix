name: 发行测试版及补齐历史版本

on:
  push:
    branches: [beta]
    paths:
      - package.json
      - .github/workflows/releases.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: broadcast-release
  cancel-in-progress: false

jobs:
  beta:
    if: github.ref == 'refs/heads/beta'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 检查 Beta 版本
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+-beta\.\d+$') { throw 'beta 分支必须使用 beta 版本号' }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: 安装依赖并验证
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 准备官方构建依赖
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/cache | Out-Null
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.4314.35/microsoft.web.webview2.1.0.4314.35.nupkg' -OutFile packaging/cache/webview2-1.0.4314.35.nupkg
          $nodeVersion = node --version
          Invoke-WebRequest "https://raw.githubusercontent.com/nodejs/node/$nodeVersion/LICENSE" -OutFile packaging/cache/Node-LICENSE.txt
      - name: 构建 Windows 便携包
        shell: pwsh
        run: |
          npm run build:workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 发布 Beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "发行 $tag 已存在；请递增版本号，避免覆盖已发布文件。" }
          $zip = "dist/转播包装工作台-$env:VERSION-Windows-x64.zip"
          $notes = 'Beta 测试版。作者尚未充分测试，特别是实际直播、AE、vMix 与 NewBlue 联动。请先备份数据并在自己的设备上验证。完整解压后运行 EXE；需 Windows x64、.NET Framework 4.7.2+ 与 WebView2。此预发行不会替代正式版。'
          gh release create $tag $zip "$zip.sha256" --target $env:GITHUB_SHA --title "转播包装工作台 $env:VERSION · Beta" --notes $notes --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 发布历史浏览器源码并迁移已校验的便携包
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for tag in v1.0.0 v1.1.0; do
            browser="$RUNNER_TEMP/${tag}-browser-source.zip"
            git archive --format=zip -o "$browser" "$tag"
            if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
              latest='--latest=false'
              if [ "$tag" = v1.1.0 ]; then latest='--latest'; fi
              notes="历史正式版本。浏览器源码版下载 browser-source.zip，解压后运行 node control/serve.js，并打开终端中的地址。Windows 便携版无需另装 Node，若 GitHub 附件暂不可用，可从原发行页下载：https://gitee.com/alanhe0728/vibe-vmix/releases/tag/$tag"
              gh release create "$tag" "$browser" --verify-tag --title "足球转播控制台 $tag · 正式版" --notes "$notes" "$latest"
            fi
            portable="football-console-${tag}-Windows-x64.zip"
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$portable"; then continue; fi
            metadata=$(curl --fail --location --retry 3 --max-time 60 "https://gitee.com/api/v5/repos/alanhe0728/vibe-vmix/releases/tags/$tag")
            for part in 001 002; do
              url=$(jq -r --arg suffix ".zip.$part" '.assets[] | select(.name | endswith($suffix)) | .browser_download_url' <<< "$metadata")
              test -n "$url" && test "$url" != null
              curl --fail --location --retry 3 --max-time 900 "$url" -o "$RUNNER_TEMP/$tag.$part"
            done
            url=$(jq -r '.assets[] | select(.name | endswith(".zip.sha256")) | .browser_download_url' <<< "$metadata")
            test -n "$url" && test "$url" != null
            curl --fail --location --retry 3 --max-time 60 "$url" -o "$RUNNER_TEMP/$tag.sha256"
            cat "$RUNNER_TEMP/$tag.001" "$RUNNER_TEMP/$tag.002" > "$RUNNER_TEMP/$portable"
            expected=$(awk '{print $1}' "$RUNNER_TEMP/$tag.sha256" | tr -d '\r\n')
            actual=$(sha256sum "$RUNNER_TEMP/$portable" | awk '{print $1}')
            test "$expected" = "$actual" || { echo "历史便携包校验失败：$tag" >&2; exit 1; }
            printf '%s  %s\n' "$actual" "$portable" > "$RUNNER_TEMP/$portable.sha256"
            gh release upload "$tag" "$RUNNER_TEMP/$portable" "$RUNNER_TEMP/$portable.sha256"
          done
