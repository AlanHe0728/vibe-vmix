<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>转播包装工作台</title>
    <script src="/shared/operator-theme.js"></script>
    <link rel="stylesheet" href="/shared/operator-theme.css" />
    <link rel="stylesheet" href="workspace.css" />
    <script defer src="workspace.js"></script>
  </head>
  <body class="operator-ui">
    <header class="menu-bar" aria-label="工作台菜单">
      <button id="manage">模块</button>
      <button id="openPreview">预览与布局</button>
      <button id="openSettings" aria-haspopup="dialog">设置</button>
      <span class="active-module" id="moduleName"></span>
    </header>
    <div class="app">
      <aside>
        <nav id="navigation" aria-label="模块"></nav>
      </aside>
      <main id="modules">
        <div class="intro">
          <h1>选择转播模块</h1>
        </div>
        <form id="moduleForm">
          <div id="catalog" class="catalog"></div>
          <div class="form-actions">
            <button type="submit" class="primary" id="apply">应用模块选择</button
            ><span id="notice" role="status" aria-live="polite"></span>
          </div>
        </form>
      </main>
      <section id="moduleView" hidden aria-label="模块控制台">
        <iframe id="moduleFrame" title="模块操作界面" allow="clipboard-write"></iframe>
      </section>
    </div>
    <dialog id="settingsDialog" aria-labelledby="settingsTitle">
      <form id="settingsForm">
        <header>
          <h2 id="settingsTitle">工作台设置</h2>
          <button type="button" id="closeSettings" aria-label="关闭设置">×</button>
        </header>
        <div class="settings-content">
          <fieldset>
            <legend>vMix 连接</legend>
            <label for="sharedVmixPort">舞台与 AE 的 Web API 端口</label>
            <input
              id="sharedVmixPort"
              type="number"
              min="1"
              max="65535"
              placeholder="沿用各模块原有端口"
            />
          </fieldset>
          <fieldset>
            <legend>工作区</legend>
            <label for="appearance">界面外观</label>
            <select id="appearance">
              <option value="light">浅色</option>
              <option value="dark">黑红暗色</option>
            </select>
            <label for="defaultPreview">打开预览时</label>
            <select id="defaultPreview">
              <option value="dual">双画面</option>
              <option value="pvw">仅 PVW</option>
              <option value="pgm">仅 PGM</option>
            </select>
            <label class="check"
              ><input id="compactSidebar" type="checkbox" /> 收起侧边栏文字</label
            >
          </fieldset>
          <fieldset id="outputs" hidden>
            <legend>上屏地址</legend>
            <div id="outputAddresses"></div>
          </fieldset>
          <output id="settingsNotice" role="status"></output>
        </div>
        <footer>
          <span class="edition" id="workspaceVersion"></span
          ><button type="submit" class="primary">保存设置</button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
