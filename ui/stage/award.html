<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>颁奖报幕 · 1920×1080</title>
    <link rel="preload" href="fonts/SourceHanSerifCN-VF.ttf.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="award.css" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      #awardStage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
        overflow: hidden; transform: translate(-50%, -50%) scale(var(--stage-scale, 1)); }
      #awardStage.with-reference { background: url("preview-stage.webp") center/contain no-repeat; }
    </style>
    <script defer src="award-render.js"></script>
    <script defer src="award-output.js"></script>
  </head>
  <body>
    <main id="awardStage"><div id="awardGraphic" style="display:none"></div></main>
  </body>
</html>
